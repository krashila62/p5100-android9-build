name: GT-P5100 integrated candidate - build only

on:
  push:
    branches: [main]
    paths: ['scripts/build_integrated.py', 'integrated-fix/**', '.github/workflows/integrated-fix.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5100-integrated-fix1
  cancel-in-progress: false

jobs:
  baseline:
    # Public repositories use standard hosted runners without paid compute.
    # Do not silently consume private-repository minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed build scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate configuration
        run: python3 scripts/build_integrated.py --check
      - name: Install build prerequisites on the temporary runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev libtinfo5 zlib1g-dev git ca-certificates
      - name: Build original kernel and collect provenance
        run: python3 scripts/build_integrated.py
      - name: Save build log and outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p5100-integrated-fix1-NOT-FLASHABLE-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6

