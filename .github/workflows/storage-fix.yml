name: GT-P5100 Android 9 FUSE compatibility build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['storage-fix/**', '.github/workflows/storage-fix.yml']
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test installer and rollback using disposable files
        run: python3 storage-fix/test_installer.py
      - name: Compile isolated FUSE daemon
        run: python3 storage-fix/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5100-storage-fuse-NOT-FLASHABLE
          path: artifacts/
          retention-days: 3

